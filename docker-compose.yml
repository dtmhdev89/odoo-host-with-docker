services:
    web:
        image: odoo:18.0
        depends_on:
         - mydb
        ports:
            - "8069:8069"
        environment:
            # - HOST=mydb
            # - USER=odoo
            # - PASSWORD=myodoo
            - PASSWORD_FILE=/run/secrets/postgresql_password
        secrets:
            - postgresql_password
        volumes:
            - ./persistent_data/odoo-data:/var/lib/odoo
            # - /path/to/config:/etc/odoo  # config file
            - ./custom-addons:/mnt/extra-addons
        networks:
            - odoo-ntw
    mydb:
        image: postgres:15
        environment:
            - POSTGRES_DB=postgres
            # - POSTGRES_PASSWORD=myodoo
            - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
            - POSTGRES_USER=odoo
            # - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - ./persistent_data/odoo-db:/var/lib/postgresql/data
            # - odoo-db-data:/var/lib/postgresql/data/pgdata
        secrets:
            - postgresql_password
        networks:
            - odoo-ntw

secrets:
    postgresql_password:
        file: odoo_pg_pass

networks:
    odoo-ntw:
        driver: bridge
